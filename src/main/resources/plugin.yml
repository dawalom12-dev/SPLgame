name: ScaleReset
version: '${project.version}'
main: dev.scalereset.ScaleResetPlugin
api-version: '1.21'
description: Сбрасывает рост игрока при PvP и накладывает кулдаун
author: You
softdepend: [MashScaleShifter, PlaceholderAPI]

commands:
  scalereset:
    description: Админ-команда плагина
    permission: scalereset.admin
    usage: /scalereset

permissions:
  scalereset.admin:
    default: op
    description: Доступ к админ-командам
